[project]
name = "open-wuwa-tappo-mod"
version = "1.0.0"
description = "OpenWuwaTappoMod - Wuwa Tappo desktop-pet overlay patcher with a Tkinter GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "brotli>=1.1.0",
]

[project.scripts]
wuwa-tappo-mod = "wuwa_tappo_mod.gui:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wuwa_tappo_mod"]
